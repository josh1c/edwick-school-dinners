<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School dinners</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #ffffff;
    --ink: #1b1a26;
    --muted: #5f5d6e;
    --line: #e4e2ea;
    --soft: #f4f3f7;
    --red: #e8342e;
    --green: #8ccf4d;
    --blue: #19aee6;
    --purple: #6f2fa3;
    --yellow: #ffe31a;
    --orange: #f07e30;
    --font: "Bricolage Grotesque", ui-rounded, "Segoe UI", system-ui, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #15141c; --ink: #f2f1f6; --muted: #a9a7b8; --line: #2d2b38; --soft: #1f1e28;
    }
  }
  :root[data-theme="dark"] {
    --page: #15141c; --ink: #f2f1f6; --muted: #a9a7b8; --line: #2d2b38; --soft: #1f1e28;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: var(--font); font-size: 1.0625rem; line-height: 1.45;
    height: 100%; overflow: hidden; overscroll-behavior: none;
  }
  html { overflow: hidden; overscroll-behavior: none; }
  @supports (height: 100dvh) { html { height: 100dvh; } }
  .wrap {
    max-width: 36rem; margin: 0 auto; height: 100%;
    padding: 1.25rem 1rem 0.75rem;
    display: flex; flex-direction: column;
  }
  main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }

  header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; min-height: 2.25rem; }
  .school { font-weight: 600; font-size: 0.95rem; color: var(--muted); margin: 0; }
  .today-link {
    flex: none; align-self: center;
    font: inherit; font-size: 0.85rem; font-weight: 600; line-height: 1.2;
    color: #fff; background: var(--red); border: 0; border-radius: 999px;
    padding: 0.45rem 0.85rem; cursor: pointer; white-space: nowrap;
  }
  .today-link[hidden] { display: none; }

  /* Week strip: five days, the chosen one filled */
  .weekbar { display: flex; align-items: center; gap: 0.4rem; margin: 1rem 0 0.4rem; }
  .arrow {
    flex: none; width: 2.4rem; height: 2.6rem; border-radius: 0.6rem;
    border: 1.5px solid var(--line); background: var(--page); color: var(--ink);
    font: inherit; font-size: 1.2rem; cursor: pointer;
  }
  .days { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.3rem; }
  .day {
    font: inherit; color: var(--ink); background: var(--soft); border: 0; border-radius: 0.6rem;
    padding: 0.4rem 0 0.35rem; cursor: pointer; line-height: 1.15;
  }
  .day small { display: block; font-size: 0.75rem; color: var(--muted); }
  .day b { font-size: 1.05rem; font-weight: 600; }
  .day[aria-current="date"] { background: var(--ink); color: var(--page); }
  .day[aria-current="date"] small { color: inherit; opacity: 0.75; }
  .day.is-today:not([aria-current="date"]) { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .weeklabel { font-size: 0.85rem; color: var(--muted); margin: 0 0 0.8rem; text-align: center; }

  .dayhead { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 0.6rem; margin: 0 0 0.6rem; }
  h1 {
    font-size: clamp(2.1rem, 9.5vw, 3.2rem); font-weight: 800; line-height: 1;
    letter-spacing: -0.02em; margin: 0;
  }
  .date { margin: 0; color: var(--muted); font-size: 1rem; }

  /* The menu itself: each option is a band in the school's own colour */
  .options { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.4rem; }
  .opt {
    display: grid; grid-template-columns: 0.75rem 1fr; align-items: stretch;
    background: var(--soft); border-radius: 0.75rem; overflow: hidden;
  }
  .opt::before { content: ""; background: var(--c); }
  .opt div { padding: 0.5rem 0.85rem; }
  .opt .name { font-size: 1.08rem; font-weight: 600; line-height: 1.22; display: block; }
  .opt .tag { font-size: 0.8rem; color: var(--muted); display: block; margin-top: 0.05rem; }

  .c-red { --c: var(--red); } .c-green { --c: var(--green); } .c-blue { --c: var(--blue); }
  .c-purple { --c: var(--purple); } .c-yellow { --c: var(--yellow); } .c-orange { --c: var(--orange); }

  .empty {
    border: 2px dashed var(--line); border-radius: 0.75rem; padding: 1.4rem 1.2rem;
  }
  .empty p { margin: 0 0 0.75rem; }
  .empty p:last-child { margin-bottom: 0; }
  .btn {
    display: inline-block; font: inherit; font-weight: 600; font-size: 1rem;
    background: var(--ink); color: var(--page); border: 0; border-radius: 0.6rem;
    padding: 0.6rem 1rem; cursor: pointer; text-decoration: none;
  }
  .btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }

  footer {
    flex: none; margin-top: 0.75rem; border-top: 1px solid var(--line); padding-top: 0.6rem;
    display: flex; align-items: center; flex-wrap: wrap; gap: 0.35rem 0.45rem; font-size: 0.82rem;
  }
  footer .label { color: var(--muted); }
  footer .cal-link {
    color: var(--ink); font-weight: 600; text-decoration: none;
    padding: 0.25rem 0.55rem; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--line);
  }
  .fine { color: var(--muted); font-size: 0.75rem; line-height: 1.35; margin: 0.5rem 0 0; }

  /* Taller phones: use the spare height for breathing room rather than empty space at the bottom */
  @media (min-height: 780px) {
    .wrap { padding-top: 1.75rem; }
    .weekbar { margin: 1.4rem 0 0.6rem; }
    .weeklabel { margin-bottom: 1.5rem; }
    .dayhead { margin-bottom: 1rem; }
    .options { gap: 0.6rem; }
    .opt div { padding: 0.85rem 1rem; }
    .opt .name { font-size: 1.2rem; }
    .fine { margin-top: 0.8rem; }
  }
  @media (min-height: 860px) {
    .wrap { padding-top: 2.25rem; }
    .opt div { padding: 1rem 1.1rem; }
  }

  button:focus-visible, a:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) {
    .options.enter .opt { animation: rise 260ms ease-out both; }
    .options.enter-next .opt { animation: from-right 220ms ease-out both; }
    .options.enter-prev .opt { animation: from-left 220ms ease-out both; }
    @keyframes from-right { from { opacity: 0; transform: translateX(24px); } }
    @keyframes from-left { from { opacity: 0; transform: translateX(-24px); } }
    .options.enter .opt:nth-child(2) { animation-delay: 30ms; }
    .options.enter .opt:nth-child(3) { animation-delay: 60ms; }
    .options.enter .opt:nth-child(4) { animation-delay: 90ms; }
    .options.enter .opt:nth-child(5) { animation-delay: 120ms; }
    .options.enter .opt:nth-child(6) { animation-delay: 150ms; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="school" id="school">School dinners</p>
    <button class="today-link" id="todayBtn" hidden aria-label="You are not viewing today. Go back to today">Not today ↩</button>
  </header>

  <nav class="weekbar" aria-label="Choose a day">
    <button class="arrow" id="prevWeek" aria-label="Previous week">‹</button>
    <div class="days" id="days"></div>
    <button class="arrow" id="nextWeek" aria-label="Next week">›</button>
  </nav>
  <p class="weeklabel" id="weekLabel"></p>

  <main id="main" aria-live="polite">
    <p>Loading the menu…</p>
  </main>

  <footer>
    <span class="label">Add to calendar</span>
    <a class="cal-link" id="calApple" href="#">Apple/Outlook</a>
    <a class="cal-link" id="calGoogle" href="#" target="_blank" rel="noopener">Google</a>
  </footer>
</div>

<script>
(() => {
  const DAY_KEYS = ["monday", "tuesday", "wednesday", "thursday", "friday"];
  const DAY_NAMES = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
  const $ = (id) => document.getElementById(id);
  let menu = null;
  let weekIndex = {};   // "YYYY-MM-DD" (Monday) -> week number
  let selected = null;  // Date at local midnight

  // ---- date helpers (all local time, no timezone surprises) ----
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const mondayOf = (d) => addDays(d, -((d.getDay() + 6) % 7));
  const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
  const schoolDay = (d) => { // weekends roll forward to Monday
    const wd = d.getDay();
    return wd === 6 ? addDays(d, 2) : wd === 0 ? addDays(d, 1) : d;
  };
  const fmt = (d, opts) => d.toLocaleDateString("en-GB", opts);

  function esc(s) {
    return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  function nextMenuWeek(from) {
    const mons = Object.keys(weekIndex).sort();
    return mons.find((m) => m >= iso(mondayOf(from)));
  }

  function render(animate) {
    const mon = mondayOf(selected);
    const monKey = iso(mon);
    const week = weekIndex[monKey];
    const dayIdx = (selected.getDay() + 6) % 7;
    const t = today();
    const tKey = iso(schoolDay(t));

    // week strip
    $("days").innerHTML = DAY_NAMES.map((n, i) => {
      const d = addDays(mon, i);
      const cur = i === dayIdx ? ' aria-current="date"' : "";
      const isToday = iso(d) === tKey ? " is-today" : "";
      return `<button class="day${isToday}" data-i="${i}"${cur} aria-label="${fmt(d, { weekday: "long", day: "numeric", month: "long" })}"><small>${n.slice(0, 3)}</small><b>${d.getDate()}</b></button>`;
    }).join("");

    $("weekLabel").textContent = week
      ? `Week of ${fmt(mon, { day: "numeric", month: "long" })}, menu week ${week}`
      : `Week of ${fmt(mon, { day: "numeric", month: "long" })}`;

    $("todayBtn").hidden = iso(selected) === tKey;

    const heading = `<div class="dayhead"><h1>${DAY_NAMES[dayIdx]}</h1><p class="date">${fmt(selected, { day: "numeric", month: "long" })}</p></div>`;
    const closed = menu.closed && menu.closed[iso(selected)];

    if (closed) {
      $("main").innerHTML = heading + `<div class="empty"><p><strong>${esc(closed)}.</strong> No school dinners today.</p></div>`;
      return;
    }

    if (!week) {
      const next = nextMenuWeek(selected);
      let body = `<p><strong>No menu for this week.</strong> It may be a school holiday, or the school hasn't published the menu yet.</p>`;
      if (next) body += `<p><button class="btn" data-goto="${next}">Go to next menu week</button></p>`;
      else body += `<p>The current menu has finished. Check back once the school publishes the next one.</p>`;
      $("main").innerHTML = heading + `<div class="empty">${body}</div>`;
      return;
    }

    const items = menu.weeks[week].days[DAY_KEYS[dayIdx]] || [];
    const list = items.map((o) => {
      const halal = o.colour === "purple" ? `<span class="tag">Halal children only</span>` : "";
      return `<li class="opt c-${esc(o.colour)}"><div><span class="name">${esc(o.name)}</span>${halal}</div></li>`;
    }).join("");
    $("main").innerHTML = heading + `<ul class="options${animate === 1 ? " enter-next" : animate === -1 ? " enter-prev" : animate ? " enter" : ""}">${list}</ul>` + finePrint();
  }

  function finePrint() {
    const parts = [];
    if (menu.note) parts.push(esc(menu.note));
    if (menu.updated) parts.push(`Menu updated ${fmt(parse(menu.updated), { day: "numeric", month: "short", year: "numeric" })}.`);
    return parts.length ? `<p class="fine">${parts.join(" ")}</p>` : "";
  }

  function go(d, animate) {
    if (animate === undefined) animate = selected ? (d > selected ? 1 : d < selected ? -1 : true) : true;
    selected = schoolDay(d);
    history.replaceState(null, "", iso(selected) === iso(schoolDay(today())) ? location.pathname : `#${iso(selected)}`);
    render(animate);
  }

  // ---- events ----
  $("days").addEventListener("click", (e) => {
    const b = e.target.closest(".day"); if (!b) return;
    go(addDays(mondayOf(selected), Number(b.dataset.i)));
  });
  $("main").addEventListener("click", (e) => {
    const b = e.target.closest("[data-goto]"); if (b) go(parse(b.dataset.goto));
  });
  $("prevWeek").onclick = () => go(addDays(mondayOf(selected), -7));
  $("nextWeek").onclick = () => go(addDays(mondayOf(selected), 7));
  $("todayBtn").onclick = () => go(today());
  document.addEventListener("keydown", (e) => {
    if (!selected || e.target.closest("input, textarea")) return;
    if (e.key === "ArrowRight") step(1);
    if (e.key === "ArrowLeft") step(-1);
  });

  // Move one school day forwards or backwards, skipping weekends
  function step(dir) {
    const wd = (selected.getDay() + 6) % 7;
    if (dir > 0) go(wd === 4 ? addDays(selected, 3) : addDays(selected, 1), 1);
    else go(wd === 0 ? addDays(selected, -3) : addDays(selected, -1), -1);
  }

  // Swipe left/right anywhere on the page to change day.
  // Swipes starting at the very edge are ignored so the phone's own back gesture still works.
  let touch = null;
  document.addEventListener("touchstart", (e) => {
    if (!selected || e.touches.length !== 1) { touch = null; return; }
    const t = e.touches[0];
    touch = (t.clientX < 24 || t.clientX > window.innerWidth - 24) ? null : { x: t.clientX, y: t.clientY, at: Date.now() };
  }, { passive: true });
  document.addEventListener("touchend", (e) => {
    if (!touch) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touch.x, dy = t.clientY - touch.y;
    const quick = Date.now() - touch.at < 600;
    touch = null;
    if (quick && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
  }, { passive: true });

  // ---- calendar subscription links (work out this site's own address) ----
  const base = location.href.replace(/[#?].*$/, "").replace(/index\.html$/, "").replace(/\/?$/, "/");
  const icsUrl = base + "menu.ics";
  const webcal = icsUrl.replace(/^https?:/, "webcal:");
  $("calApple").href = webcal;
  $("calGoogle").href = "https://calendar.google.com/calendar/r?cid=" + encodeURIComponent(webcal);

  // ---- load ----
  fetch("menu.json", { cache: "no-cache" })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((data) => {
      menu = data;
      for (const [num, w] of Object.entries(data.weeks)) for (const s of w.startDates) weekIndex[s] = num;
      $("school").textContent = `${data.school} dinners`;
      document.title = `${data.school} dinners`;
      const h = location.hash.slice(1);
      go(/^\d{4}-\d{2}-\d{2}$/.test(h) ? parse(h) : today(), true);
    })
    .catch(() => {
      $("main").innerHTML = `<div class="empty"><p><strong>The menu couldn't be loaded.</strong></p><p>Check that <code>menu.json</code> sits next to this page, and open the site from its GitHub Pages address rather than as a file on your computer.</p></div>`;
    });
})();
</script>
</body>
</html>
